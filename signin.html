<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | NovaApp</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white border-b shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">

                <a href="index.html" class="text-2xl font-bold text-indigo-600">
                    NovaApp
                </a>

                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="about.html" class="nav-link">About</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                    <a href="signup.html"
                       class="text-indigo-600 hover:text-indigo-800 font-medium">
                        Sign Up
                    </a>
                    <a href="signin.html"
                       class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 transition">
                        Sign In
                    </a>
                </div>

                <button id="mobileMenuBtn"
                        class="md:hidden text-gray-700 text-2xl"
                        aria-label="Open menu">
                    ☰
                </button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu" class="hidden md:hidden pb-4">
                <a href="index.html" class="mobile-link">Home</a>
                <a href="about.html" class="mobile-link">About</a>
                <a href="contact.html" class="mobile-link">Contact</a>
                <a href="signup.html" class="mobile-link">Sign Up</a>
                <a href="signin.html" class="mobile-link">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Sign In Section -->
    <main class="min-h-[calc(100vh-160px)] flex items-center justify-center px-4 py-16">

        <div class="w-full max-w-md">

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16
                            bg-indigo-100 text-indigo-600 rounded-full mb-4 text-2xl">
                    🔐
                </div>

                <h1 class="text-3xl font-bold text-gray-900">
                    Welcome Back
                </h1>

                <p class="text-gray-500 mt-2">
                    Sign in to your NovaApp account
                </p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-2xl shadow-lg p-8 border border-gray-100">

                <form id="signinForm" novalidate>

                    <!-- Email -->
                    <div class="mb-5">
                        <label for="signinEmail"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signinEmail"
                            name="email"
                            placeholder="you@example.com"
                            class="form-input"
                            required
                        >

                        <p id="signinEmailError"
                           class="error-message"></p>
                    </div>

                    <!-- Password -->
                    <div class="mb-5">
                        <div class="flex justify-between items-center mb-2">
                            <label for="signinPassword"
                                   class="block text-sm font-medium text-gray-700">
                                Password
                            </label>

                            <a href="#"
                               class="text-sm text-indigo-600 hover:text-indigo-800">
                                Forgot password?
                            </a>
                        </div>

                        <div class="relative">
                            <input
                                type="password"
                                id="signinPassword"
                                name="password"
                                placeholder="Enter your password"
                                class="form-input pr-12"
                                required
                                minlength="6"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="signinPassword"
                                aria-label="Show password">
                                👁
                            </button>
                        </div>

                        <p id="signinPasswordError"
                           class="error-message"></p>
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center mb-6">
                        <input
                            type="checkbox"
                            id="remember"
                            class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500"
                        >

                        <label for="remember"
                               class="ml-2 text-sm text-gray-600">
                            Remember me
                        </label>
                    </div>

                    <!-- Submit -->
                    <button
                        type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700
                               text-white font-semibold py-3 rounded-lg
                               transition duration-200">
                        Sign In
                    </button>

                    <p id="signinSuccess"
                       class="success-message">
                    </p>
                </form>

                <!-- Sign Up Link -->
                <div class="border-t mt-6 pt-6 text-center">
                    <p class="text-gray-600 text-sm">
                        Don’t have an account?
                        <a href="signup.html"
                           class="text-indigo-600 font-semibold hover:underline">
                            Sign up.
                        </a>
                    </p>
                </div>
            </div>

            <!-- Extra Component -->
            <div class="mt-6 bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-center">
                <p class="text-sm text-indigo-700">
                    ✨ Join thousands of users already using NovaApp.
                </p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center">
            <p>
                © 2026 NovaApp. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
